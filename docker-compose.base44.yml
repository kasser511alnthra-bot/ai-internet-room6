services:
  app:
    image: node:22-alpine
    working_dir: /app
    restart: on-failure
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "npm install --no-audit --no-fund --loglevel=error && (node --watch server/index.mjs > /tmp/server.log 2>&1 &) && exec npx vite --host 0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5173/ || { echo FRONTEND-FAIL; exit 1; }; wget -qO /dev/null http://127.0.0.1:4000/api/health || { echo BACKEND-FAIL; exit 1; }"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  node_modules:
